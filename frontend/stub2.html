
    <!DOCTYPE html>
    <html>
    <head>
        <style>
            body { margin: 0; padding: 0; background-color: #1a1a1a; color: #ffffff; font-family: 'Montserrat', sans-serif; }
            .container { padding: 40px; }
            select:focus { outline: 4px solid #FFD700 !important; }
            button:focus { outline: 4px solid #FFD700 !important; }
        </style>
    </head>
    <body>
        <div class="container">
            <select
                aria-label="Select Language"
                style="font-size: 24px; padding: 10px; background-color: #005f73; color: #fff; border: none; border-radius: 8px; cursor: pointer;"
            >
                <option value="English">English</option>
            </select>

            <button
                aria-label="ANSWER CALL"
                style="font-size: 36px; padding: 20px 60px; background-color: #22c55e; color: white; border: none; border-radius: 100px; font-weight: bold; cursor: pointer; box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); transition: transform 0.2s;"
            >
                📞 ANSWER CALL
            </button>

            <button
                aria-label="END SESSION"
                style="font-size: 36px; padding: 20px 60px; background-color: #ef4444; color: white; border: none; border-radius: 100px; font-weight: bold; cursor: pointer; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); transition: transform 0.2s;"
            >
                ☎️ END SESSION
            </button>
        </div>
    </body>
    </html>
